version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsetwin}
      POSTGRES_USER: ${POSTGRES_USER:-pulsetwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pulsetwin}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend — Fastify API + WebSocket
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pulsetwin}
      POSTGRES_USER: ${POSTGRES_USER:-pulsetwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_dev_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_ENABLED: ${ML_SERVICE_ENABLED:-true}
      DEMO_SEED: ${DEMO_SEED:-42}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ML Service — Python FastAPI (prediction engine)
  # ---------------------------------------------------------------------------
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEMO_SEED: ${DEMO_SEED:-42}
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Simulator — Synthetic PLC + production data generator
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_URL: http://backend:3001
      SIMULATOR_PORT: ${SIMULATOR_PORT:-3002}
      SIMULATOR_TICK_MS: ${SIMULATOR_TICK_MS:-1000}
      SIMULATOR_TIME_SCALE: ${SIMULATOR_TIME_SCALE:-1}
      DEMO_SEED: ${DEMO_SEED:-42}
      DEMO_AUTO_START: ${DEMO_AUTO_START:-false}
      DEMO_TIME_ACCELERATION: ${DEMO_TIME_ACCELERATION:-60}
    ports:
      - '${SIMULATOR_PORT:-3002}:3002'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frontend — Vite + React + Three.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3001}
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
